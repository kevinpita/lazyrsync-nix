name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8

      - name: Build lazyrsync
        run: nix build .#lazyrsync --print-build-logs

      - name: Check lazyrsync version
        run: ./result/bin/lazyrsync --version

      - name: Verify package contents
        run: test -x ./result/bin/lazyrsync
