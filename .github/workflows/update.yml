name: Check for Updates

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Specific version to update to"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8

      - name: Check for new version
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          CURRENT_VERSION=$(sed -n 's/.*version = "\([^"]*\)".*/\1/p' package.nix | head -1)
          echo "Current version: $CURRENT_VERSION"

          if [ -n "$INPUT_VERSION" ]; then
            LATEST_VERSION="$INPUT_VERSION"
          else
            LATEST_VERSION=$(gh api repos/westpoint-io/lazyrsync/releases/latest --jq '.tag_name' | sed 's/^v//' || echo "")
          fi
          LATEST_VERSION="${LATEST_VERSION#v}"

          if [ -z "$LATEST_VERSION" ]; then
            echo "Could not fetch latest version"
            exit 0
          fi
          if [[ ! "$LATEST_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $LATEST_VERSION"
            exit 1
          fi

          echo "Latest version: $LATEST_VERSION"

          if [ "$CURRENT_VERSION" != "$LATEST_VERSION" ]; then
            {
              echo "new_version=$LATEST_VERSION"
              echo "current_version=$CURRENT_VERSION"
              echo "update_needed=true"
            } >> "$GITHUB_OUTPUT"
          else
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update version
        if: steps.check.outputs.update_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.check.outputs.new_version }}
        run: ./scripts/update.sh --version "$NEW_VERSION"

      - name: Create Pull Request
        if: steps.check.outputs.update_needed == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update lazyrsync to version ${{ steps.check.outputs.new_version }}"
          title: "chore: update lazyrsync to version ${{ steps.check.outputs.new_version }}"
          body: |
            ## Update lazyrsync

            This PR updates lazyrsync from version ${{ steps.check.outputs.current_version }} to ${{ steps.check.outputs.new_version }}.

            ### Changes
            - Updated `version` in `package.nix`
            - Updated source and Cargo dependency hashes
            - Updated `flake.lock`

            ---
            This PR was automatically generated by the update workflow.
          branch: update-lazyrsync-${{ steps.check.outputs.new_version }}
          delete-branch: true
          labels: |
            dependencies
            automated

      - name: Enable Auto-Merge
        if: steps.check.outputs.update_needed == 'true' && steps.create-pr.outputs.pull-request-number
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash --delete-branch

      - name: Summary
        if: always()
        env:
          UPDATE_NEEDED: ${{ steps.check.outputs.update_needed }}
          CURRENT_VERSION_OUTPUT: ${{ steps.check.outputs.current_version }}
          NEW_VERSION_OUTPUT: ${{ steps.check.outputs.new_version }}
        run: |
          {
            echo "## Update Summary"
            echo ""

            if [ "$UPDATE_NEEDED" = "true" ]; then
              echo "- Current Version: $CURRENT_VERSION_OUTPUT"
              echo "- Latest Version: $NEW_VERSION_OUTPUT"
              echo ""
              echo "Pull request created. Auto-merge was attempted when supported."
            else
              CURRENT_VERSION=$(sed -n 's/.*version = "\([^"]*\)".*/\1/p' package.nix | head -1)
              echo "- Current Version: $CURRENT_VERSION"
              echo ""
              echo "Already up to date."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
